# ---------------------------------------------------------------------------
# Continuous integration for hbtn-devops-pipeline-lab.
#
# HEADS UP: this workflow is DELIBERATELY BROKEN. It ships with three separate
# faults of three different kinds, and repairing them one commit at a time is
# the pipeline-repair task.
#
# Read the run logs in the Actions tab and let them tell you where to look. Do
# not rewrite the file from scratch: the exercise is the diagnosis, not the
# typing. Each fault has its own signature, and fixing one only gets you as far
# as the next.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env: 
      DATABASE_URL: postgres://pipeline:pipeline@localhost:5432/pipeline

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports
        run: npm test -- --reporters=default --reporters=jest-junit

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ./reports
          retention-days: 7

  build:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/john-natty/hbnt-devops-pipeline-lab

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Traceability format: ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Latest format: ghcr.io/${{ github.repository }}:latest
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          IMAGE_URL: ghcr.io/john-natty/hbnt-devops-pipeline-lab:${{ github.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"imageUrl\":\"${IMAGE_URL}\"}"

      - name: Verify staging
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          for attempt in {1..20}; do
            echo "Staging check attempt ${attempt}/20"

            health_code=$(curl --silent --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 10 \
              "${STAGING_URL}/health" || true)

            items_code=$(curl --silent --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 10 \
              "${STAGING_URL}/items" || true)

            echo "/health -> HTTP ${health_code}"
            echo "/items  -> HTTP ${items_code}"

            if [ "${health_code}" = "200" ] && [ "${items_code}" = "200" ]; then
              echo "Staging verification succeeded."
              exit 0
            fi

            sleep 15
          done

          echo "Staging verification failed."
          exit 1
